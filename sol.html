<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Sol ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

overflow:hidden;

background:#021322;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

color:white;

}

#ocean{

position:fixed;

width:100%;

height:100%;

background:

linear-gradient(

180deg,

#011526,

#01314d,

#045a84,

#0878ad

);

animation:water 8s infinite alternate;

}

@keyframes water{

0%{

filter:hue-rotate(0deg);

}

100%{

filter:hue-rotate(15deg);

}

}

#stars{

position:fixed;

width:100%;

height:100%;

overflow:hidden;

}

.star{

position:absolute;

background:white;

border-radius:50%;

opacity:.8;

animation:twinkle 3s infinite;

}

@keyframes twinkle{

50%{

opacity:.2;

transform:scale(.5);

}

}

#container{

position:relative;

z-index:10;

width:92%;

max-width:420px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(12px);

border-radius:25px;

padding:25px;

text-align:center;

box-shadow:0 0 30px rgba(0,0,0,.5);

animation:fade 2s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(60px);

}

to{

opacity:1;

transform:translateY(0);

}

}

h1{

font-size:32px;

margin-bottom:15px;

}

p{

line-height:1.7;

margin-top:15px;

}

button{

margin-top:20px;

padding:14px 35px;

border:none;

border-radius:40px;

font-size:18px;

cursor:pointer;

background:#ff4d88;

color:white;

transition:.4s;

}

button:hover{

transform:scale(1.05);

}

#terminal{

display:none;

text-align:left;

font-family:monospace;

background:#000;

padding:18px;

border-radius:15px;

margin-top:20px;

color:#57ff57;

font-size:14px;

white-space:pre-line;

}

#photo{

display:none;

width:100%;

border-radius:20px;

margin-top:20px;

box-shadow:0 0 25px black;

}

#story{

display:none;

font-size:18px;

margin-top:20px;

min-height:170px;

}

#final{

display:none;

font-size:22px;

font-weight:bold;

margin-top:25px;

}

.heart{

position:fixed;

font-size:22px;

animation:float 5s linear forwards;

pointer-events:none;

}

@keyframes float{

0%{

transform:translateY(0) scale(.5);

opacity:1;

}

100%{

transform:translateY(-100vh) scale(2);

opacity:0;

}

}

</style>

</head>

<body>

<div id="ocean"></div>

<div id="stars"></div>

<div id="container">

<h1>Hola Sol ☀️</h1>

<p>

Hay algo preparado especialmente para vos...

</p>

<button onclick="start()">

Descubrir

</button>

<div id="terminal"></div>

<img id="photo" src="sirena.jpg">

<div id="story"></div>

<div id="final"></div>

</div>

<script>

for(let i=0;i<120;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.width=(Math.random()*3+1)+"px";

s.style.height=s.style.width;

s.style.animationDelay=Math.random()*4+"s";

document.getElementById("stars").appendChild(s);

}
